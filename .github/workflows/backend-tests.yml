name: Qualidade IDDUN

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iddun-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Python 3.11 / pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Obter código
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Executar testes
        run: python -m pytest -q

      - name: Validar migrations Alembic
        env:
          DATABASE_URL: sqlite:////tmp/iddun-migrations.db
          SECRET_KEY: ci-migration-secret
          APP_ENV: development
        run: |
          rm -f /tmp/iddun-migrations.db
          python -m flask --app run:app db upgrade
          python -m flask --app run:app db current

  mobile-quality:
    name: Node 22 / mobile quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Obter código
        uses: actions/checkout@v7

      - name: Configurar Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Validar TypeScript
        run: npm run typecheck

      - name: Validar ESLint
        run: npm run lint
