name: Qualidade IDDUN

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iddun-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Python 3.11 / pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Obter código
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Instalar instrumento de cobertura
        run: python -m pip install 'pytest-cov>=6,<8'

      - name: Executar testes e medir cobertura
        run: python -m pytest -q --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iddun-backend-coverage
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Validar migrations Alembic
        env:
          DATABASE_URL: sqlite:////tmp/iddun-migrations.db
          SECRET_KEY: ci-migration-secret
          APP_ENV: development
        run: |
          rm -f /tmp/iddun-migrations.db
          python -m flask --app run:app db upgrade
          python -m flask --app run:app db current


  web-e2e:
    name: Chromium / Playwright Web E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: sqlite:////tmp/iddun-web-e2e.db
      SECRET_KEY: ci-browser-tests-isolated-secret
      APP_ENV: development
      UPLOAD_FOLDER: /tmp/iddun-web-e2e-uploads

    steps:
      - name: Obter código
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'pytest-playwright>=0.7,<1'

      - name: Instalar Chromium
        run: python -m playwright install --with-deps chromium

      - name: Criar base de testes com migrations reais
        run: |
          rm -f /tmp/iddun-web-e2e.db
          python -m flask --app run:app db upgrade

      - name: Preparar cliente autenticado descartável
        env:
          IDDUN_E2E_SEED: "1"
        run: python -m e2e.seed_client

      - name: Iniciar Flask isolado
        run: |
          python -m flask --app run:app run --host 127.0.0.1 --port 8765 --no-reload > /tmp/iddun-web-e2e-flask.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/ > /dev/null; then
              echo "Flask disponível para testes E2E"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/iddun-web-e2e-flask.log
          exit 1

      - name: Executar E2E no Chromium
        run: |
          python -m pytest e2e -q --browser chromium --base-url http://127.0.0.1:8765 \
            --screenshot only-on-failure --output test-results

      - name: Publicar evidências E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iddun-web-e2e-evidence
          path: |
            test-results/
            /tmp/iddun-web-e2e-flask.log
          if-no-files-found: ignore
          retention-days: 14

  mobile-quality:
    name: Node 22 / mobile quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Obter código
        uses: actions/checkout@v7

      - name: Configurar Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Instalar dependências
        run: npm ci

      # npm audit treats findings below the chosen threshold as non-blocking.
      # Fail closed for critical runtime vulnerabilities without hiding the
      # remaining high/moderate findings collected in the full audit artifact.
      - name: Bloquear novas vulnerabilidades npm críticas
        run: npm audit --omit=dev --audit-level=critical

      - name: Conferir versão oficial do Expo SDK
        run: npx expo install --check

      - name: Conferir instalação do expo-calendar
        run: npm ls expo-calendar --depth=0

      - name: Validar TypeScript
        run: npm run typecheck

      - name: Validar ESLint
        run: npm run lint

      # Advisory first: collect and triage npm findings before enabling a blocking gate.
      # Keep a separate production-only view to avoid conflating tooling with runtime exposure.
      - name: Auditar dependências npm (baseline consultivo)
        if: always()
        shell: bash
        run: |
          npm audit --json > npm-audit-full.json || true
          npm audit --omit=dev --json > npm-audit-production.json || true
          node <<'NODE'
          const fs = require("node:fs");
          const rows = [];
          for (const [name, file] of [
            ["Todas as dependências", "npm-audit-full.json"],
            ["Apenas produção (--omit=dev)", "npm-audit-production.json"],
          ]) {
            try {
              const data = JSON.parse(fs.readFileSync(file, "utf8"));
              const counts = data.metadata?.vulnerabilities;
              if (!counts) throw new Error(data.error?.summary || data.error?.message || "Sem resumo de vulnerabilidades");
              rows.push(`| ${name} | ${counts.info || 0} | ${counts.low || 0} | ${counts.moderate || 0} | ${counts.high || 0} | ${counts.critical || 0} |`);
            } catch (error) {
              console.warn(`NPM AUDIT INCONCLUSIVO (${name}): ${error.message}`);
              rows.push(`| ${name} | - | - | - | - | INCONCLUSIVO |`);
            }
          }
          const summary = [
            "## Baseline npm / Expo (consultivo)",
            "Este relatório não significa que as vulnerabilidades estejam corrigidas.",
            "| Escopo | Info | Low | Moderate | High | Critical |",
            "| --- | ---: | ---: | ---: | ---: | ---: |",
            ...rows,
            "Próximo passo: examinar advisories, dependências transitivas e patches compatíveis antes de bloquear o CI.",
          ].join("\n");
          console.log(summary);
          if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + "\n");
          NODE

      - name: Publicar auditoria npm
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iddun-mobile-npm-audit
          path: |
            mobile/npm-audit-full.json
            mobile/npm-audit-production.json
          if-no-files-found: warn
          retention-days: 14



  postgres-booking:
    name: PostgreSQL / concorrência de reservas
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: iddun_test
          POSTGRES_PASSWORD: iddun_test_password
          POSTGRES_DB: iddun_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iddun_test -d iddun_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg2://iddun_test:iddun_test_password@localhost:5432/iddun_qa
      IDDUN_TEST_POSTGRES_URL: postgresql+psycopg2://iddun_test:iddun_test_password@localhost:5432/iddun_qa
      SECRET_KEY: qa-ci-postgres-disposable-secret
      APP_ENV: development

    steps:
      - name: Obter código
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Aplicar migrations PostgreSQL
        run: python -m flask --app run:app db upgrade

      - name: Verificar restrição com duas transações concorrentes
        run: python -m pytest -q tests/test_postgres_booking_concurrency.py

  security-baseline:
    name: Auditoria inicial de segurança Python
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Obter código
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Instalar ferramentas de segurança
        run: python -m pip install 'bandit>=1.8,<2' 'pip-audit>=2.9,<3'

      # The initial QA baseline was advisory. Findings are now triaged,
      # so Python security regressions must fail the pull request.
      - name: Analisar riscos estáticos com Bandit
        run: bandit -r app -ll -ii -f txt -o bandit-report.txt

      - name: Auditar dependências com pip-audit
        run: pip-audit -r requirements.txt --progress-spinner off --format json --output pip-audit-report.json

      - name: Publicar relatórios de segurança
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iddun-security-baseline
          path: |
            bandit-report.txt
            pip-audit-report.json
          if-no-files-found: ignore
          retention-days: 14
