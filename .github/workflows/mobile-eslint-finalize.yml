name: Mobile ESLint Finalize

on:
  push:
    branches:
      - sprint/0-production-foundation

permissions:
  contents: write

concurrency:
  group: mobile-eslint-finalize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    name: Expo 57 / ESLint finalize
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Obter código
        uses: actions/checkout@v7
        with:
          ref: sprint/0-production-foundation

      - name: Configurar Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Instalar dependências atuais
        run: npm ci

      - name: Resolver ESLint compatível com Expo 57
        run: npx expo install eslint eslint-config-expo --dev

      - name: Versionar package files gerados
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Package files já estão atualizados."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "build: configura ESLint compatível com Expo 57"
            git push origin HEAD:sprint/0-production-foundation
          fi

      - name: Validar TypeScript
        run: npm run typecheck

      - name: Validar ESLint
        run: npm run lint
