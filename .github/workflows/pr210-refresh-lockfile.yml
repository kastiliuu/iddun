name: Refresh npm lockfile for PR 210
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - be/nv07-business-weekly-hours
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: be/nv07-business-weekly-hours
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate lockfile from pinned patched overrides
        working-directory: mobile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Check reproducible npm ci and lint
        working-directory: mobile
        run: |
          npm ci --ignore-scripts --no-fund
          npm run typecheck
          npm run lint
      - name: Commit lockfile if validation passes
        run: |
          if ! git diff --quiet -- mobile/package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add mobile/package-lock.json
            git commit -m "chore(security): regenerate audited mobile lockfile"
            git push origin HEAD:be/nv07-business-weekly-hours
          fi
