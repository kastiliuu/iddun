name: Reparar lockfile PR111
on:
  push:
    branches:
      - fix/v0-lockfile-ci-111
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regenerate:
    if: github.ref == 'refs/heads/fix/v0-lockfile-ci-111'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerar lockfile oficialmente
        working-directory: mobile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Publicar somente lockfile corrigido nesta branch
        run: |
          if git diff --quiet -- mobile/package-lock.json; then
            echo "Lockfile já reproduzível."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package-lock.json
          git commit -m "fix(mobile): regenerate npm lockfile with official npm"
          git push origin HEAD:fix/v0-lockfile-ci-111
