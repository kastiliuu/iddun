name: Regerar lockfile PR111
on:
  push:
    branches: [fix/v0-lockfile-ci-111]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Atualizar lockfile via npm oficial
        working-directory: mobile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
          npx expo install --check
      - name: Enviar lockfile somente se validado
        run: |
          if git diff --quiet -- mobile/package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package-lock.json
          git commit -m "fix(mobile): regenerate Expo SDK 57 lockfile"
          git push origin HEAD:fix/v0-lockfile-ci-111
