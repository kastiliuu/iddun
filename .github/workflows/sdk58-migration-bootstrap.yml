name: SDK 58 migration bootstrap (temporary)
# Generates a consistent lockfile in an isolated branch and removes itself.
on:
  push:
    branches:
      - be/mobile-expo-sdk58
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.ref == 'refs/heads/be/mobile-expo-sdk58'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json
      - name: Install SDK 58 dependency set atomically (no peer bypass)
        working-directory: mobile
        run: |
          npm install --save \
            expo@^58.0.0 \
            '@expo/ui@~58.0.27' \
            'expo-blur@~58.0.5' \
            'expo-calendar@~58.0.6' \
            'expo-constants@~58.0.15' \
            'expo-device@~58.0.5' \
            'expo-font@~58.0.11' \
            'expo-glass-effect@~58.0.5' \
            'expo-haptics@~58.0.7' \
            'expo-image@~58.0.18' \
            'expo-image-manipulator@~58.0.16' \
            'expo-image-picker@~58.0.10' \
            'expo-linear-gradient@~58.0.3' \
            'expo-linking@~58.0.16' \
            'expo-router@~58.0.30' \
            'expo-secure-store@~58.0.2' \
            'expo-splash-screen@~58.0.13' \
            'expo-status-bar@~58.0.4' \
            'expo-symbols@~58.0.4' \
            'expo-system-ui@~58.0.7' \
            'expo-web-browser@~58.0.7' \
            'react@19.3.0' \
            'react-dom@19.3.0' \
            'react-native@0.88.1' \
            'react-native-gesture-handler@~3.3.0' \
            'react-native-reanimated@4.7.1' \
            'react-native-safe-area-context@~5.11.1' \
            'react-native-screens@~4.30.1' \
            'react-native-web@^0.21.4' \
            'react-native-worklets@0.13.0'
          npm install --save-dev '@types/react@~19.3.0' 'eslint-config-expo@~58.0.4'
          npx expo install --check
      - name: Commit consistent manifests and remove bootstrap workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sdk58-migration-bootstrap.yml
          git add mobile/package.json mobile/package-lock.json
          git diff --cached --check
          git commit -m "chore(mobile): migrate Expo SDK 58 dependencies and npm lockfile"
          git push origin HEAD:be/mobile-expo-sdk58
      - name: Verify lockfile and Expo Doctor
        working-directory: mobile
        run: |
          npm ci
          npx expo install --check
          npx expo-doctor@latest
      - name: Typecheck and lint
        working-directory: mobile
        run: |
          npx expo customize tsconfig.json --help || true
          npm run typecheck
          npm run lint
