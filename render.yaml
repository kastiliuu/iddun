services:
  - type: web
    name: iddun-web
    runtime: python
    region: virginia
    plan: free
    branch: main

    # Ambiente hospedado de desenvolvimento/preview.
    # APP_ENV permanece production para ativar cookies Secure e secrets obrigatórios.
    # O plano free não é a infraestrutura definitiva da V1 pública.
    # No plano gratuito, a migração fica no build.
    buildCommand: pip install -r requirements.txt && flask --app run:app db upgrade

    startCommand: gunicorn --workers 2 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT run:app
    healthCheckPath: /health
    autoDeployTrigger: commit

    envVars:
      - key: APP_ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: iddun-db
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true

      - key: MEDIA_STORAGE_BACKEND
        value: local

      - key: UPLOAD_FOLDER
        value: /opt/render/project/src/app/static/uploads

      - key: RATELIMIT_STORAGE_URI
        value: memory://

databases:
  - name: iddun-db
    region: virginia
    plan: free
    databaseName: iddun
    user: iddun_app
    postgresMajorVersion: "18"
    ipAllowList: []
